<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoot Renamer</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#16181c;--muted:#667085;--line:#e4e7ec;--accent:#1d4ed8;--accent-soft:#eff4ff;--ok:#067647;--ok-soft:#ecfdf3;--bad:#b42318;--bad-soft:#fef3f2;--chip:#eef2ff}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  a{color:var(--accent)}
  .wrap{max-width:1400px;margin:0 auto;padding:0 20px}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  header .wrap{display:flex;align-items:center;gap:16px;padding-top:14px;padding-bottom:14px}
  header h1{font-size:20px;margin:0}
  .account{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:14px}
  .pill.on{background:var(--ok-soft);color:var(--ok)}
  .pill.off{background:var(--bad-soft);color:var(--bad)}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
  button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer;color:var(--ink)}
  button:hover{border-color:#c5cad3}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.go{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600;font-size:16px;padding:11px 22px}
  button.warn{background:var(--bad-soft);color:var(--bad);border-color:#fda29b;font-weight:600}
  button.link{border:none;background:none;color:var(--accent);padding:4px 6px}
  button:disabled{opacity:.45;cursor:default}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0}
  .panel h2{font-size:15px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .howto{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .howto ol{margin:0;padding-left:22px}
  .howto li{margin:3px 0}
  .howto .note{font-size:14px;color:var(--muted);margin-top:8px}
  .form{display:grid;grid-template-columns:150px 1fr 1fr 2fr auto;gap:12px;align-items:end}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:13px;color:var(--muted);font-weight:500}
  input[type=text]{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;width:100%;background:#fff}
  input[type=text]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .crumbs{font-size:15px;margin-bottom:10px}
  .crumbs a{text-decoration:none}
  .subfolders{display:flex;gap:8px;flex-wrap:wrap}
  .subfolders button{padding:7px 14px}
  .toolbar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 20px;margin:16px 0;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row .grow{flex:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{background:var(--chip);border:1px solid #c7d2fe;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px;user-select:none}
  .chip:hover{background:#e0e7ff}
  .chip .x{margin-left:8px;color:var(--muted)}
  .muted{color:var(--muted);font-size:14px}
  .counts{font-size:14px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:30px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .card.selected{outline:3px solid var(--accent)}
  .card.done{border-color:#abefc6;background:#fbfefc}
  .thumb{position:relative;aspect-ratio:4/3;background:#1d1f23;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .thumb img{width:100%;height:100%;object-fit:contain}
  .thumb .tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:2px 8px;border-radius:4px}
  .thumb .tag.video{background:#b42318}
  .thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:2px 8px;border-radius:4px}
  .thumb .sel{position:absolute;right:8px;top:8px;width:20px;height:20px}
  .body{padding:12px;display:flex;flex-direction:column;gap:8px}
  .orig{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .meta .res{width:90px;padding:5px 8px;font-size:13px}
  .badge{font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid var(--line);background:var(--bg)}
  .badge.h{background:#fef7c3;border-color:#fde272}
  .badge.v{background:#e0f2fe;border-color:#7cd4fd}
  .badge.k4{background:var(--bad-soft);border-color:#fda29b;color:var(--bad)}
  .newname{font-size:12px;word-break:break-all;padding:8px;background:var(--bg);border-radius:8px;min-height:36px;font-family:ui-monospace,Menlo,monospace}
  .newname.ok{color:var(--accent);background:var(--accent-soft)}
  .newname.done{color:var(--ok);background:var(--ok-soft)}
  .donebar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ok);font-weight:600}
  .empty{padding:50px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px}
  details{margin:16px 0}
  summary{cursor:pointer;color:var(--muted);font-size:14px}
  #log{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;color:var(--muted);padding:10px 0}
  .lang{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:14px}.lang .link{font-weight:600;color:var(--muted)}.lang .link.on{color:var(--accent);text-decoration:underline}
  .adv{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:14px;padding-top:10px}
  .modal{position:fixed;inset:0;background:rgba(16,24,40,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
  .modal.show{display:flex}
  .modal .box{background:var(--card);border-radius:14px;max-width:640px;width:100%;padding:24px 26px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 4px;font-size:20px}
  .modal .sub{color:var(--muted);margin:0 0 16px;font-size:14px}
  .modal ol{padding-left:22px;margin:0 0 16px}
  .modal li{margin:10px 0}
  .modal .linkrow{display:flex;gap:8px;margin:8px 0}
  .modal .linkrow button{white-space:nowrap;flex:none}
  .modal .linkrow input{font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
  .kbd{display:inline-block;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:0 6px;font-size:13px}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(140%);transition:transform .25s;z-index:20;padding:16px 26px;border-radius:12px;font-size:17px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.18);max-width:90vw}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast.ok{background:var(--ok);color:#fff}
  #toast.bad{background:var(--bad);color:#fff}
  #toast.info{background:var(--ink);color:#fff}
  @media (max-width:900px){.form{grid-template-columns:1fr 1fr}.form .wide{grid-column:1/-1}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Shoot Renamer</h1>
    <div class="lang"><button class="link" data-lang="en">EN</button>|<button class="link" data-lang="es">ES</button></div>
    <div class="account">
      <span class="pill off" id="acct"><span class="dot"></span><span id="acctText"></span></span>
      <button id="auth" class="primary"></button>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="panel" id="howtoPanel">
    <div class="howto">
      <div>
        <h2 data-i18n="howTitle"></h2>
        <ol data-i18n="howSteps"></ol>
        <div class="note" data-i18n="howNote"></div>
      </div>
      <button class="link" id="hideHowto" data-i18n="hide"></button>
    </div>
  </div>
  <button class="link" id="showHowto" style="display:none;margin-top:12px" data-i18n="show"></button>

  <div class="panel">
    <div class="form">
      <div class="field"><label data-i18n="lYymm"></label><input type="text" id="yymm" placeholder="2506" maxlength="4"></div>
      <div class="field"><label data-i18n="lShoot"></label><input type="text" id="shoot" placeholder="Pee In The Park"></div>
      <div class="field"><label data-i18n="lLoc"></label><input type="text" id="location" placeholder="Images"></div>
      <div class="field wide"><label data-i18n="lFolder"></label><input type="text" id="folder" placeholder="https://drive.google.com/drive/folders/..."></div>
      <button id="load" class="primary" data-i18n="load"></button>
    </div>
    <div id="folderbar" style="display:none;margin-top:16px">
      <div class="crumbs" id="crumbs"></div>
      <div class="subfolders" id="subfolders"></div>
    </div>
  </div>

  <div class="toolbar" id="toolbar" style="display:none">
    <div class="row">
      <span class="muted" data-i18n="subjects"></span>
      <div class="chips grow" id="chips"></div>
      <input type="text" id="newchip" data-i18n-ph="addSubject" style="width:170px">
    </div>
    <div class="row">
      <span class="counts grow" id="counts"></span>
      <button id="selectAll" data-i18n="selAll"></button>
      <button id="selectNone" data-i18n="selNone"></button>
      <button id="convert" data-i18n="convert"></button>
      <button id="exportCsv" data-i18n="csv"></button>
      <button id="rename" class="go"></button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg"></div>

  <details>
    <summary data-i18n="adv"></summary>
    <div class="adv">
      <label><input type="checkbox" id="pxImages" checked> <span data-i18n="optPx"></span></label>
      <label><input type="checkbox" id="labelVideo" checked> <span data-i18n="optVid"></span></label>
      <label><span data-i18n="optSort"></span> <select id="sort"><option value="name" data-i18n="sortName"></option><option value="created" data-i18n="sortTime"></option></select></label>
      <button id="setup" data-i18n="setup"></button>
    </div>
  </details>
  <details>
    <summary data-i18n="logTitle"></summary>
    <div id="log"></div>
  </details>
</div>

<div class="modal" id="convModal">
  <div class="box">
    <h3 data-i18n="mTitle"></h3>
    <p class="sub" data-i18n="mSub"></p>
    <ol>
      <li data-i18n="mS1"></li>
      <li><span data-i18n="mS2"></span></li>
      <li><span data-i18n="mS3"></span>
        <div class="linkrow"><input type="text" id="convLink" readonly><button id="copyLink" data-i18n="mCopy"></button></div></li>
      <li data-i18n="mS4"></li>
    </ol>
    <div class="actions">
      <button id="closeModal" data-i18n="mClose"></button>
      <button id="reloadAfter" data-i18n="mReload"></button>
      <button id="openColab" class="primary" data-i18n="mOpen"></button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

  tLoading: 'Google aún está cargando, prueba otra vez en un segundo', tSignFail: e => 'No se pudo iniciar sesión: ' + e,
  tSignedIn: e => 'Sesión iniciada: ' + e, tExpired: 'La sesión ha caducado, vuelve a iniciar sesión',
  tNeedSign: 'Primero inicia sesión con Google (arriba a la derecha)', tNeedLink: 'Primero pega el enlace de una carpeta de Google Drive',
  tOpenFail: e => 'No se pudo abrir la carpeta: ' + e, tTick: 'Primero marca algunas fotos o pulsa en una casilla de tema',
  tNothing: 'Aún no hay nada que renombrar. Añade temas primero.', dupes: 'Dos archivos tendrían el mismo nombre, corrígelo primero:\n',
  confirm: (n, a, b) => `¿Renombrar ${n} archivo(s) en Google Drive?\n\nEl primero:\n${a}\n→ ${b}`,
  tPartial: (ok, n, f) => `Renombrados ${ok} de ${n}. ${f} fallaron, mira el Registro de actividad abajo.`,
  tDone: n => `✓ Hecho. ${n} archivo${n === 1 ? '' : 's'} renombrado${n === 1 ? '' : 's'} en Drive.`,
  errAccess: 'sin permiso (necesitas acceso de Editor)', errNotFound: 'no existe o no tienes acceso', cid: 'Client ID de Google OAuth:', cidSaved: 'Client ID guardado',
  csvHead: ['nombre actual', 'nombre nuevo', 'ancho', 'alto', 'tipo'], already: '(ya tenía nombre)', tPhoto: 'foto', tVideo: 'vídeo',
  fYymm: 'YYMM', fShoot: 'Shoot', fLoc: 'Location'
}};
let lang = LS('lang') || ((navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en');
function t(k, ...a) { const v = (T[lang] || T.en)[k]; return typeof v === 'function' ? v(...a) : v; }
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
}
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; SS('lang', lang); applyLang(); setAccount(); render(); });

let token = null, tokenClient = null, email = '';
let files = [], subfolders = [], crumbs = [], focused = null;
let chips = JSON.parse(LS('chips') || '[]');

// ---------- small UI helpers ----------
let toastTimer;
function toast(msg, kind = 'info', ms = 4000) {
  const t = $('toast'); t.textContent = msg; t.className = kind + ' show';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = kind, ms);
}
function log(m) { $('log').textContent = (new Date().toLocaleTimeString() + '  ' + m + '\n' + $('log').textContent).slice(0, 6000); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function setAccount() {
  const on = !!token;
  $('acct').className = 'pill ' + (on ? 'on' : 'off');
  $('acctText').textContent = on ? t('signedAs', email || '…') : t('notSigned');
  $('auth').textContent = on ? t('switchAcct') : t('signIn');
  $('auth').className = on ? '' : 'primary';
}

// instructions toggle
function howto(show) { $('howtoPanel').style.display = show ? '' : 'none'; $('showHowto').style.display = show ? 'none' : ''; SS('howto', show ? '1' : '0'); }
$('hideHowto').onclick = () => howto(false);
$('showHowto').onclick = () => howto(true);
howto(LS('howto') !== '0');

// persisted fields
['yymm', 'shoot', 'location', 'folder'].forEach(id => {
  $(id).value = LS('f_' + id) || '';
  $(id).addEventListener('input', () => { SS('f_' + id, $(id).value); render(); });
});
$('pxImages').checked = LS('pxImages') !== '0';
$('labelVideo').checked = LS('labelVideo') !== '0';
$('pxImages').onchange = () => { SS('pxImages', $('pxImages').checked ? '1' : '0'); files.forEach(f => { if (!f.done) f.res = defaultRes(f); }); render(); };
$('labelVideo').onchange = () => { SS('labelVideo', $('labelVideo').checked ? '1' : '0'); files.forEach(f => { if (!f.done) f.res = defaultRes(f); }); render(); };
$('sort').onchange = () => { sortFiles(); render(); };

// ---------- auth ----------
$('setup').onclick = () => {
  const id = prompt(t('cid'), clientId());
  if (id !== null && id.trim()) { SS('clientId', id.trim()); tokenClient = null; toast(t('cidSaved')); }
};
$('auth').onclick = () => {
  if (!window.google) { toast(t('tLoading'), 'bad'); return; }
  if (!tokenClient) {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId(), scope: SCOPE,
      callback: async r => {
        if (r.error) { log('sign-in error: ' + r.error); toast(t('tSignFail', r.error), 'bad'); return; }
        token = r.access_token; email = '';
        const exp = Date.now() + (r.expires_in || 3600) * 1000 - 60000;
        setAccount();
        try { const a = await api('/about?fields=user(emailAddress,displayName)'); email = a.user.emailAddress; } catch (e) { log('could not read account: ' + e.message); }
        try { sessionStorage.setItem('auth', JSON.stringify({ token, email, exp })); } catch (e) {}
        const mine = token; setTimeout(() => { if (token === mine) { token = null; email = ''; try { sessionStorage.removeItem('auth'); } catch (e) {} setAccount(); toast(t('tExpired'), 'info', 6000); } }, exp - Date.now());
        if (email) SS('lastEmail', email);
        setAccount(); log('signed in as ' + email); toast(t('tSignedIn', email), 'ok');
      }
    });
  }
  if (token) tokenClient.requestAccessToken({ prompt: 'select_account' });
  else if (LS('lastEmail')) tokenClient.requestAccessToken({ prompt: '', login_hint: LS('lastEmail') });
  else tokenClient.requestAccessToken({ prompt: 'consent' });
};

async function api(path, opts = {}) {
  if (!token) throw new Error('not signed in');
  const r = await fetch(API + path, { ...opts, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { token = null; email = ''; try { sessionStorage.removeItem('auth'); } catch (e) {} setAccount(); toast(t('tExpired'), 'bad'); throw new Error('session expired'); }
  if (r.status === 403 || r.status === 404) { const t = await r.text(); throw new Error((r.status === 404 ? t('errNotFound') : t('errAccess')) + ' · ' + t.slice(0, 120)); }
  if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 200));
  return r.json();
}

// ---------- loading ----------
function folderId(s) { s = s.trim(); const m = s.match(/folders\/([A-Za-z0-9_-]+)/); return m ? m[1] : s.split('?')[0]; }
$('load').onclick = () => {
  if (!token) { toast(t('tNeedSign'), 'bad'); return; }
  const id = folderId($('folder').value);
  if (!id) { toast(t('tNeedLink'), 'bad'); return; }
  crumbs = []; openFolder(id, null);
};

async function openFolder(id, name) {
  try {
    if (name === null) {
      const meta = await api(`/files/${id}?fields=id,name&supportsAllDrives=true`);
      crumbs = [{ id, name: meta.name }];
    } else {
      const i = crumbs.findIndex(c => c.id === id);
      if (i >= 0) crumbs = crumbs.slice(0, i + 1); else crumbs.push({ id, name });
    }
    $('grid').innerHTML = ''; $('emptyMsg').style.display = ''; $('emptyMsg').textContent = t('loading');
    const fields = 'nextPageToken,files(id,name,mimeType,thumbnailLink,createdTime,imageMediaMetadata(width,height,time),videoMediaMetadata(width,height,durationMillis))';
    let items = [], pageToken = '';
    do {
      const q = encodeURIComponent(`'${id}' in parents and trashed=false`);
      const d = await api(`/files?q=${q}&fields=${fields}&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true&orderBy=name${pageToken ? '&pageToken=' + pageToken : ''}`);
      items = items.concat(d.files || []); pageToken = d.nextPageToken || '';
    } while (pageToken);
    subfolders = items.filter(f => f.mimeType === 'application/vnd.google-apps.folder');
    files = items.filter(f => f.mimeType !== 'application/vnd.google-apps.folder').map(hydrate);
    if (crumbs.length > 1) { $('location').value = crumbs[crumbs.length - 1].name; SS('f_location', $('location').value); }
    try { sessionStorage.setItem('crumbs', JSON.stringify(crumbs)); } catch (e) {}
    sortFiles();
    $('folderbar').style.display = '';
    render();
    log(`opened ${crumbs.map(c => c.name).join(' / ')}: ${files.length} files, ${subfolders.length} subfolders`);
  } catch (e) { log('load failed: ' + e.message); toast(t('tOpenFail', e.message), 'bad', 7000); $('emptyMsg').textContent = t('cantOpen'); }
}

const NAME_RE = /^(\d{4})_(.+?)_(.+?)_(.+?)_(\d{2,3})_([^_]+)\.[A-Za-z0-9]+$/;
function hydrate(f) {
  const im = f.imageMediaMetadata, vm = f.videoMediaMetadata;
  const w = (im && im.width) || (vm && vm.width) || 0, h = (im && im.height) || (vm && vm.height) || 0;
  const ext = (f.name.match(/\.([A-Za-z0-9]+)$/) || ['', ''])[1];
  const o = { id: f.id, name: f.name, ext, w, h, long: Math.max(w, h),
    isVideo: f.mimeType.startsWith('video/'), thumb: f.thumbnailLink ? f.thumbnailLink.replace(/=s\d+(-c)?$/, '=s600') : '',
    dur: vm && vm.durationMillis ? Math.round(vm.durationMillis / 1000) : 0,
    created: (im && im.time) || f.createdTime || '', subject: '', selected: false, done: false };
  const m = f.name.match(NAME_RE);
  if (m) { o.done = true; o.subject = m[4]; o.existingNum = parseInt(m[5], 10); o.res = m[6]; }
  else o.res = defaultRes(o);
  return o;
}
function defaultRes(f) {
  if (!f.long) return '';
  if (f.isVideo) return ($('labelVideo').checked && f.long === 1920) ? '1080p' : String(f.long);
  return $('pxImages').checked ? f.long + 'px' : String(f.long);
}
function sortFiles() {
  const k = $('sort').value;
  files.sort((a, b) => k === 'created' ? (a.created > b.created ? 1 : a.created < b.created ? -1 : 0) : a.name.localeCompare(b.name, undefined, { numeric: true }));
}

// ---------- naming ----------
function clean(s) { return (s || '').trim().replace(/[\\/:*?"<>|_]+/g, ' ').replace(/\s+/g, ' '); }
function computeNames() {
  const yymm = $('yymm').value.trim(), shoot = clean($('shoot').value), loc = clean($('location').value);
  const counters = {};
  files.forEach(f => { if (f.done && f.subject) { const k = f.subject.toLowerCase(); counters[k] = Math.max(counters[k] || 0, f.existingNum || 0); } });
  files.forEach(f => {
    f.newName = '';
    if (f.done) return;
    const subj = clean(f.subject);
    if (!yymm || !shoot || !loc || !subj) return;
    const k = subj.toLowerCase();
    counters[k] = (counters[k] || 0) + 1;
    f.newName = `${yymm}_${shoot}_${loc}_${subj}_${String(counters[k]).padStart(2, '0')}_${f.res || 'RES'}${f.ext ? '.' + f.ext : ''}`;
  });
}
function missingFields() {
  return ['yymm', 'shoot', 'location'].filter(id => !$(id).value.trim()).map(id => ({ yymm: t('fYymm'), shoot: t('fShoot'), location: t('fLoc') }[id]));
}

// ---------- render ----------
function render() {
  computeNames();
  $('crumbs').innerHTML = crumbs.map((c, i) => i === crumbs.length - 1 ? `<b>📂 ${esc(c.name)}</b>` : `<a href="#" data-i="${i}">${esc(c.name)}</a>`).join(' &nbsp;/&nbsp; ');
  $('crumbs').querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); const c = crumbs[+a.dataset.i]; openFolder(c.id, c.name); });
  $('subfolders').innerHTML = subfolders.length ? subfolders.map(s => `<button data-id="${s.id}" data-name="${esc(s.name)}">📁 ${esc(s.name)}</button>`).join('') : '';
  $('subfolders').querySelectorAll('button').forEach(b => b.onclick = () => openFolder(b.dataset.id, b.dataset.name));

  const used = new Set(chips.map(c => c.toLowerCase()));
  files.forEach(f => { const s = clean(f.subject); if (s && !used.has(s.toLowerCase())) { chips.push(s); used.add(s.toLowerCase()); } });
  SS('chips', JSON.stringify(chips));
  $('chips').innerHTML = chips.length ? chips.map(c => `<span class="chip" data-c="${esc(c)}">${esc(c)}<span class="x" title="remove">×</span></span>`).join('') : `<span class="muted">${t('noChips')}</span>`;
  $('chips').querySelectorAll('.chip').forEach(el => el.onclick = e => {
    if (e.target.classList.contains('x')) { chips = chips.filter(c => c !== el.dataset.c); render(); return; }
    applySubject(el.dataset.c);
  });

  const g = $('grid');
  $('toolbar').style.display = files.length ? '' : 'none';
  if (!files.length) {
    g.innerHTML = '';
    $('emptyMsg').style.display = '';
    $('emptyMsg').textContent = crumbs.length ? (subfolders.length ? t('emptySub') : t('emptyNone')) : t('emptyStart');
    return;
  }
  $('emptyMsg').style.display = 'none';

  const ready = files.filter(f => f.newName).length, named = files.filter(f => f.done).length, left = files.length - named - ready;
  $('counts').innerHTML = t('counts', files.length, named, ready, left);
  $('rename').textContent = ready ? t('renameN', ready) : t('rename0');
  $('rename').disabled = !ready;
  const n4k = files.filter(f => f.isVideo && f.long > 1920).length;
  $('convert').textContent = n4k ? t('convert4k', n4k) : t('convert');
  $('convert').className = n4k ? 'warn' : '';

  g.innerHTML = files.map(f => {
    const k4 = f.isVideo && f.long > 1920;
    return `
    <div class="card ${f.selected ? 'selected' : ''} ${f.done ? 'done' : ''}" data-id="${f.id}">
      <div class="thumb">
        ${f.thumb ? `<img loading="lazy" src="${f.thumb}" alt="">` : `<span style="color:#999">${t('noPreview')}</span>`}
        <span class="tag ${f.isVideo ? 'video' : ''}">${f.isVideo ? t('video') : t('photo')}</span>
        ${f.dur ? `<span class="dur">${Math.floor(f.dur / 60)}:${String(f.dur % 60).padStart(2, '0')}</span>` : ''}
        ${f.done ? '' : `<input type="checkbox" class="sel" ${f.selected ? 'checked' : ''} title="✓">`}
      </div>
      <div class="body">
        <div class="orig" title="${esc(f.name)}">${f.done ? '' : t('now')}${esc(f.name)}</div>
        <div class="meta">
          <span>${f.w && f.h ? f.w + '×' + f.h : t('sizeUnknown')}</span>
          ${f.w && f.h ? `<span class="badge ${f.w > f.h ? 'h' : 'v'}">${f.w > f.h ? t('land') : f.w < f.h ? t('port') : t('square')}</span>` : ''}
          ${k4 ? `<span class="badge k4" title="${t('k4tip')}">4K</span>` : ''}
          ${f.done ? '' : `<input type="text" class="res" value="${esc(f.res || '')}" placeholder="${t('size')}" title="${t('size')}">`}
        </div>
        ${f.done
          ? `<div class="donebar"><span>${t('named')}</span><button class="link again">${t('again')}</button></div>`
          : `<input type="text" class="subject" list="subjectlist" placeholder="${t('subjPh')}" value="${esc(f.subject)}">
             <div class="newname ${f.newName ? 'ok' : ''}">${f.newName ? '→ ' + esc(f.newName) : (f.subject && missingFields().length ? t('fillIn', missingFields().join(', ')) : t('newHere'))}</div>`}
      </div>
    </div>`;
  }).join('') + `<datalist id="subjectlist">${chips.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;

  g.querySelectorAll('.card').forEach(card => {
    const f = files.find(x => x.id === card.dataset.id);
    if (f.done) {
      card.querySelector('.again').onclick = () => { f.done = false; f.subject = ''; f.res = defaultRes(f); render(); const el = document.querySelector(`.card[data-id="${f.id}"] .subject`); if (el) el.focus(); };
      return;
    }
    card.querySelector('.sel').onchange = e => { f.selected = e.target.checked; card.classList.toggle('selected', f.selected); };
    card.querySelector('.thumb').onclick = e => { if (e.target.classList.contains('sel')) return; f.selected = !f.selected; card.querySelector('.sel').checked = f.selected; card.classList.toggle('selected', f.selected); };
    const s = card.querySelector('.subject');
    s.onfocus = () => { focused = f.id; };
    s.onchange = () => { f.subject = s.value; render(); };
    s.onkeydown = e => { if (e.key === 'Enter') { f.subject = s.value; render(); focusNext(f.id); } };
    card.querySelector('.res').onchange = e => { f.res = e.target.value.trim(); render(); };
  });
}
function focusNext(id) {
  const i = files.findIndex(f => f.id === id);
  const next = files.slice(i + 1).find(f => !f.done);
  if (next) { const el = document.querySelector(`.card[data-id="${next.id}"] .subject`); if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
}
function applySubject(s) {
  const sel = files.filter(f => f.selected && !f.done);
  if (sel.length) sel.forEach(f => { f.subject = s; f.selected = false; });
  else if (focused) { const f = files.find(x => x.id === focused); if (f && !f.done) f.subject = s; }
  else { toast(t('tTick'), 'info'); return; }
  render();
}
$('newchip').onkeydown = e => { if (e.key === 'Enter') { const v = clean($('newchip').value); if (v && !chips.some(c => c.toLowerCase() === v.toLowerCase())) chips.push(v); $('newchip').value = ''; render(); } };
$('selectAll').onclick = () => { files.forEach(f => { if (!f.done) f.selected = true; }); render(); };
$('selectNone').onclick = () => { files.forEach(f => f.selected = false); render(); };

// ---------- export / rename ----------
const COLAB = 'https://colab.research.google.com/github/jordialbanell/shoot-renamer/blob/main/convert_4k_to_1080p.ipynb';
async function copyLink() { try { await navigator.clipboard.writeText($('convLink').value); $('copyLink').textContent = t('mCopied'); setTimeout(() => $('copyLink').textContent = t('mCopy'), 2000); } catch (e) { $('convLink').select(); } }
$('convert').onclick = () => {
  if (!crumbs.length) { toast(t('tNoFolder'), 'info'); return; }
  $('convLink').value = 'https://drive.google.com/drive/folders/' + crumbs[crumbs.length - 1].id;
  $('convModal').classList.add('show'); copyLink();
};
$('copyLink').onclick = copyLink;
$('openColab').onclick = () => { copyLink(); window.open(COLAB, '_blank'); };
$('closeModal').onclick = () => $('convModal').classList.remove('show');
$('convModal').onclick = e => { if (e.target.id === 'convModal') $('convModal').classList.remove('show'); };
$('reloadAfter').onclick = () => { $('convModal').classList.remove('show'); const c = crumbs[crumbs.length - 1]; openFolder(c.id, c.name); };
$('exportCsv').onclick = () => {
  computeNames();
  const rows = [t('csvHead')].concat(files.map(f => [f.name, f.newName || (f.done ? t('already') : ''), f.w, f.h, f.isVideo ? t('tVideo') : t('tPhoto')]));
  const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `rename_${$('yymm').value}_${clean($('shoot').value)}_${clean($('location').value)}.csv`; a.click();
};
$('rename').onclick = async () => {
  computeNames();
  const todo = files.filter(f => f.newName);
  if (!todo.length) { toast(t('tNothing'), 'info'); return; }
  const dupes = todo.map(f => f.newName.toLowerCase()).filter((n, i, a) => a.indexOf(n) !== i);
  if (dupes.length) { alert(t('dupes') + [...new Set(dupes)].join('\n')); return; }
  if (!confirm(t('confirm', todo.length, todo[0].name, todo[0].newName))) return;
  $('rename').disabled = true;
  let ok = 0, fail = 0;
  for (const f of todo) {
    $('rename').textContent = t('renaming', ok + fail + 1, todo.length);
    try {
      await api(`/files/${f.id}?supportsAllDrives=true`, { method: 'PATCH', body: JSON.stringify({ name: f.newName }) });
      log('renamed ' + f.name + ' → ' + f.newName);
      f.name = f.newName; const m = f.newName.match(NAME_RE); f.done = true; f.existingNum = m ? parseInt(m[5], 10) : 0; f.newName = ''; ok++;
    } catch (e) { fail++; log('FAILED ' + f.name + ': ' + e.message); }
  }
  render();
  if (fail) toast(t('tPartial', ok, todo.length, fail), 'bad', 8000);
  else toast(t('tDone', ok), 'ok', 5000);
};

// keep the Google session across page refreshes (Google tokens last 1 hour)
try {
  const a = JSON.parse(sessionStorage.getItem('auth') || 'null');
  if (a && a.token && a.exp > Date.now()) {
    token = a.token; email = a.email || '';
    setTimeout(() => { if (token === a.token) { token = null; email = ''; sessionStorage.removeItem('auth'); setAccount(); toast(t('tExpired'), 'info', 6000); } }, a.exp - Date.now());
  } else sessionStorage.removeItem('auth');
} catch (e) {}
applyLang(); setAccount(); render();
if (token) {
  let saved = null; try { saved = JSON.parse(sessionStorage.getItem('crumbs') || 'null'); } catch (e) {}
  if (saved && saved.length) { crumbs = saved; const c = saved[saved.length - 1]; openFolder(c.id, c.name); }
  else if ($('folder').value.trim()) $('load').click();
}
})();
</script>
